{
  "schema_version": "1.0.0",
  "catalog_version": "1.1.0",
  "normative_language": "BCP14-uppercase",
  "controls": [
    {
      "id": "GOV-001", "title": "Authority chain and conflict resolution", "strength": "MUST",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Resolve instructions through the approved authority order and stop for a material conflict, missing source, or ambiguous scope.",
      "verifier": ["work-item authority table review", "conflict disposition validator"], "evidence": ["authority source identities", "conflict disposition or explicit none"],
      "blocking": true, "owner": "system owner", "cadence": "per_task", "exception_eligible": false
    },
    {
      "id": "GOV-002", "title": "Named human accountability", "strength": "MUST",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Assign a named human owner and authorized human risk-acceptance authority; an agent cannot occupy either role.",
      "verifier": ["profile schema", "identity directory check"], "evidence": ["profile owner fields", "approval matrix"],
      "blocking": true, "owner": "organization governance", "cadence": "quarterly", "exception_eligible": false
    },
    {
      "id": "GOV-003", "title": "Declared work item", "strength": "MUST",
      "trigger": {"all": [{"path": "work_item.material_change", "op": "exists", "value": true}]},
      "action": "Declare outcome, non-goals, contracts, change classes, diagram triggers, risk, gates, authority, effects, definition of done, and stop conditions before implementation.",
      "verifier": ["work-item template checker"], "evidence": ["authorized work item digest"],
      "blocking": true, "owner": "work-item human owner", "cadence": "per_task", "exception_eligible": false
    },
    {
      "id": "GOV-004", "title": "Mandatory stop conditions", "strength": "MUST",
      "trigger": {"any": [{"path": "context.stop_condition", "op": "eq", "value": true}]},
      "action": "Stop before the next state change and obtain the named authority's recorded resolution; do not retry, suppress, or silently narrow scope.",
      "verifier": ["execution event monitor", "effect authorization gate"], "evidence": ["stop event", "human resolution or blocked result"],
      "blocking": true, "owner": "system owner", "cadence": "continuous", "exception_eligible": false
    },
    {
      "id": "GOV-005", "title": "Material-change control", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.material_change", "op": "eq", "value": true}]},
      "action": "Record the changed baseline/contract, need, alternatives, risk/impact, verification, rollout, rollback, owner, and human authorization; tool/dependency/service changes also require pinned identity, security/license, maintenance, and noise assessment.",
      "verifier": ["material-change record validator"], "evidence": ["approved material-change record", "registry/profile update"],
      "blocking": true, "owner": "system owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "GOV-006", "title": "Independent review separation", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.risk_class", "op": "in", "value": ["high", "critical"]}, {"path": "work_item.change_classes", "op": "intersects", "value": ["architecture_design", "auth_security", "migrations_data", "ai_model_behavior", "infrastructure", "release"]}]},
      "action": "Use an authorized reviewer separated from implementation identity, model conversation, mutable context, writable evidence, and approval conflict.",
      "verifier": ["review-record schema", "independence semantic check"], "evidence": ["review record", "immutable revision and evidence identities"],
      "blocking": true, "owner": "review authority", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "GOV-007", "title": "Formal waiver path", "strength": "MUST",
      "trigger": {"any": [{"path": "context.required_control_not_passed", "op": "eq", "value": true}]},
      "action": "Block unless the control is exception-eligible and a schema-valid, signed, unexpired waiver names scope, owner, reason, risk, compensation, evidence, issue, and expiry.",
      "verifier": ["waiver schema", "catalog eligibility check", "expiry/signature check"], "evidence": ["waiver record", "compensating-control result"],
      "blocking": true, "owner": "risk acceptance authority", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "GOV-008", "title": "No fabricated or overstated evidence", "strength": "MUST NOT",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Claim no command, pass, review, signature, source, operational state, compliance state, or independence without retained supporting evidence.",
      "verifier": ["evidence reference/digest checker", "claim-to-result audit"], "evidence": ["verification records", "review/signature records", "limitations"],
      "blocking": true, "owner": "all contributors", "cadence": "continuous", "exception_eligible": false
    },
    {
      "id": "GOV-009", "title": "Continuous control effectiveness", "strength": "MUST",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Test configured controls on the profile cadence using declared populations and risk-stratified samples; block affected claims when evidence is stale or a control does not prevent, detect, or recover from its target failure.",
      "verifier": ["control-evidence age gate", "risk-stratified effectiveness test", "corrective-action tracker"], "evidence": ["control population and sample", "design/operating-effectiveness results", "failures, owners, deadlines, and retest"],
      "blocking": true, "owner": "control assurance owner", "cadence": "quarterly", "exception_eligible": true,
      "references": ["https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"]
    },
    {
      "id": "GOV-010", "title": "Specialized domain authority boundary", "strength": "MUST",
      "trigger": {"any": [{"path": "context.specialized_domain_requirement", "op": "eq", "value": true}, {"path": "context.high_impact_decision", "op": "eq", "value": true}]},
      "action": "Trace each specialized financial, legal, medical, safety, employment, tax, accounting, regulatory, or equivalent rule to an approved higher-authority identity, scope, owner, acceptance criteria, and change authority; stop rather than create, reinterpret, approve, or accept risk for the domain decision.",
      "verifier": ["domain-authority and contract trace check", "scope/owner/approval validator"], "evidence": ["authoritative domain rule identity", "qualified owner and approval", "implementation/test traceability", "explicit claim boundary"],
      "blocking": true, "owner": "system owner and qualified domain authority", "cadence": "per_task", "exception_eligible": false
    },
    {
      "id": "DES-001", "title": "Threat model and architecture assurance", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "architecture_design"}, {"path": "work_item.material_change_triggers", "op": "intersects", "value": ["architecture_boundary", "security_privacy_boundary", "external_contract", "external_service", "high_impact_decision"]}]},
      "action": "Update the versioned architecture record and threat/abuse register for affected assets, boundaries, identities, data flows, dependencies, failure modes, mitigations, tests, residual risks, and owners before implementation is approved.",
      "verifier": ["architecture-record completeness check", "threat-to-control/test traceability", "owner/review age gate"], "evidence": ["architecture record identity", "threat and abuse register", "mitigation/test mapping", "architecture/security owner review"],
      "blocking": true, "owner": "architecture/security owner", "cadence": "per_change", "exception_eligible": true,
      "references": ["https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle", "https://csrc.nist.gov/pubs/sp/800/218/final"]
    },
    {
      "id": "DES-002", "title": "Architecture diagrams and runtime traceability", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "architecture_design"}, {"path": "work_item.material_change_triggers", "op": "intersects", "value": ["architecture_boundary", "security_privacy_boundary", "external_service"]}]},
      "action": "Maintain profile-selected system-context, component/dependency, deployment, and data-flow/trust-boundary diagrams as version-controlled text with stable IDs; render them and trace changed nodes/flows to contracts, implementation, configuration, tests, and deployment evidence.",
      "verifier": ["diagram parse/render check", "stable node/flow ID validator", "diagram-to-contract/config drift check"], "evidence": ["diagram sources and renders", "node/flow traceability table", "documented-to-deployed drift result"],
      "blocking": true, "owner": "architecture owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "DES-003", "title": "Critical behavioral flow and state diagrams", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.diagram_triggers", "op": "intersects", "value": ["authorization_or_approval", "multi_stage_transaction", "state_machine", "retry_timeout_recovery", "rollback_or_safe_disable", "external_effect", "system_of_record_or_reconciliation", "incident_or_continuity"]}]},
      "action": "Diagram each triggered decision flow or state machine, including authorization, negative branches, timeouts, retries, partial failure, confirmation, compensation, rollback, safe-disable, reconciliation, cleanup, and terminal outcomes; map every branch to a contract, test, control, or accepted residual risk.",
      "verifier": ["flow/state diagram render check", "branch-to-test/control coverage check"], "evidence": ["flow/state diagram", "branch and transition inventory", "mapped tests, controls, and residual-risk decisions"],
      "blocking": true, "owner": "component/domain owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-001", "title": "Preserve unrelated state", "strength": "MUST",
      "trigger": {"all": [{"path": "context.repository_change", "op": "eq", "value": true}]},
      "action": "Inspect and preserve unrelated changes; stop on overlapping unexpected dirty state that cannot be separated safely.",
      "verifier": ["pre/post status capture", "intended-file manifest"], "evidence": ["status snapshots", "reviewed diff/file list"],
      "blocking": true, "owner": "implementer", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "ENG-002", "title": "Contract-coherent change", "strength": "MUST",
      "trigger": {"all": [{"path": "context.repository_change", "op": "eq", "value": true}]},
      "action": "Update implementation, tests, schemas, fixtures, migrations, architecture/threat/flow diagrams, documentation, observability, and generated artifacts that express the changed contract.",
      "verifier": ["contract traceability check", "generated drift check"], "evidence": ["affected-contract table", "test and artifact results"],
      "blocking": true, "owner": "component owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-003", "title": "Defect regression coverage", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.corrects_defect", "op": "eq", "value": true}]},
      "action": "Add a regression test that fails before the correction and passes after it, or obtain an eligible waiver naming the impossible condition and compensating check.",
      "verifier": ["test diff review", "regression result"], "evidence": ["regression test identity and result", "waiver if used"],
      "blocking": true, "owner": "component owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-004", "title": "API and schema compatibility", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "api_schema"}]},
      "action": "Run compatibility analysis, consumer contract tests, exact schema validation, versioning decision, deprecation notice, migration, and rollback checks selected by the matrix.",
      "verifier": ["API/schema compatibility gate", "consumer contract tests"], "evidence": ["compatibility report", "version/deprecation decision", "test results"],
      "blocking": true, "owner": "API owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-005", "title": "Migration and data safety", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "migrations_data"}]},
      "action": "Test forward migration, invariants, data-loss bounds, concurrency, backup/restore, abort thresholds, and rollback or documented recovery against a production-equivalent dataset and engine.",
      "verifier": ["verify-live migration suite", "backup/restore verifier"], "evidence": ["migration result", "data validation", "recovery result"],
      "blocking": true, "owner": "data owner", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "ENG-006", "title": "Cancellation, timeout, retry, and resource bounds", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "intersects", "value": ["domain_code", "api_schema", "performance", "ai_model_behavior", "infrastructure"]}]},
      "action": "Define and test cancellation propagation, timeouts, bounded retries, idempotency, rate limits, memory/CPU/storage/network limits, and cleanup after interruption.",
      "verifier": ["bounded-execution tests", "resource monitor"], "evidence": ["limit configuration", "timeout/cancellation/retry results", "cleanup result"],
      "blocking": true, "owner": "component owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-007", "title": "Performance and cost budgets", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "performance"}, {"path": "work_item.material_change_triggers", "op": "contains", "value": "cost_model"}]},
      "action": "Measure declared workloads against latency, throughput, resource, saturation, variance, and cost budgets using an approved baseline and production-equivalent environment.",
      "verifier": ["performance gate", "budget comparator"], "evidence": ["workload/baseline identity", "measurements and variance", "budget decision"],
      "blocking": true, "owner": "service owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-008", "title": "Accessible real UI behavior", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "ui_accessibility"}]},
      "action": "Test changed flows in real supported browsers/devices with keyboard, focus, zoom/reflow, assistive technology, error recovery, visual states, and automated accessibility analysis.",
      "verifier": ["browser/device test", "manual accessibility review", "accessibility scanner"], "evidence": ["interaction recording/screenshots", "manual review", "scanner report"],
      "blocking": true, "owner": "UI/accessibility owner", "cadence": "per_change", "exception_eligible": true,
      "references": ["https://www.w3.org/TR/WCAG22/"]
    },
    {
      "id": "ENG-009", "title": "Observability and diagnostic safety", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "intersects", "value": ["domain_code", "api_schema", "migrations_data", "auth_security", "ai_model_behavior", "infrastructure", "release"]}]},
      "action": "Provide tested logs, metrics, traces, alerts, correlation identities, redaction, retention, ownership, and failure/runbook links for changed operational behavior.",
      "verifier": ["telemetry contract tests", "redaction/DLP check", "alert exercise"], "evidence": ["telemetry samples without prohibited data", "alert/runbook result"],
      "blocking": true, "owner": "service owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "ENG-010", "title": "Backup, restore, and disaster recovery", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "intersects", "value": ["migrations_data", "infrastructure", "release"]}]},
      "action": "Meet declared RPO/RTO by testing backup integrity, restore, failover, dependency recovery, authority, and post-recovery validation for the changed scope.",
      "verifier": ["backup/restore exercise", "disaster-recovery exercise"], "evidence": ["RPO/RTO measurements", "restore/failover verification", "owner approval"],
      "blocking": true, "owner": "operations owner", "cadence": "per_release", "exception_eligible": true
    },
    {
      "id": "ENG-011", "title": "Supported platform and deprecation", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.material_change_triggers", "op": "contains", "value": "supported_platform"}, {"path": "context.platform_near_end_of_support", "op": "eq", "value": true}]},
      "action": "Record support dates, notify before the configured threshold, test upgrade/compatibility/rollback, and block new deployment after support end without an eligible waiver.",
      "verifier": ["platform inventory checker", "end-of-support date gate"], "evidence": ["support inventory", "notices", "upgrade/rollback results or waiver"],
      "blocking": true, "owner": "platform owner", "cadence": "monthly", "exception_eligible": true
    },
    {
      "id": "VER-001", "title": "Shared local and CI entrypoints", "strength": "MUST",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Make local and CI execution invoke the same version-controlled tier entrypoints; permit CI matrices and isolation only around those entrypoints.",
      "verifier": ["workflow-to-entrypoint trace check"], "evidence": ["entrypoint identities", "CI workflow mapping"],
      "blocking": true, "owner": "build owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "VER-002", "title": "Deterministic tier selection", "strength": "MUST",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Select minimum tiers from declared change classes, risk class, matrix triggers, catalog triggers, and profile increases; no actor may silently lower them.",
      "verifier": ["tier selector", "work-item/matrix comparison"], "evidence": ["selected checks and trigger trace"],
      "blocking": true, "owner": "verification owner", "cadence": "per_task", "exception_eligible": false
    },
    {
      "id": "VER-003", "title": "Machine-readable verification evidence", "strength": "MUST",
      "trigger": {"all": [{"path": "context.verification_run", "op": "eq", "value": true}]},
      "action": "Emit schema-valid JSON with revision, exact command, tool version/digest, UTC timestamps, environment, checks, status, evidence digests, limitations, and unrun checks.",
      "verifier": ["verification-result schema", "attachment digest checker"], "evidence": ["verification-result JSON", "referenced attachments"],
      "blocking": true, "owner": "verification owner", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "VER-004", "title": "Vulnerability scanner pin and data currentness", "strength": "MUST",
      "trigger": {"any": [{"path": "context.vulnerability_scan", "op": "eq", "value": true}]},
      "action": "Use the pinned scanner and record advisory source, database snapshot/revision, fetched-at time, scan time, maximum age, reachability method, and unresolved limitations.",
      "verifier": ["vulnerability evidence semantic check"], "evidence": ["scanner identity", "advisory database currentness", "findings and reachability result"],
      "blocking": true, "owner": "security owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "VER-005", "title": "Clean and reproducible release build", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "release"}]},
      "action": "Build the immutable candidate from a clean disposable environment with identified inputs and compare artifact digests or approved equivalence tolerances.",
      "verifier": ["verify-release clean build", "reproducibility comparator"], "evidence": ["source/input/tool digests", "build results", "artifact comparison"],
      "blocking": true, "owner": "release owner", "cadence": "per_release", "exception_eligible": true
    },
    {
      "id": "VER-006", "title": "Production-equivalent live evidence", "strength": "MUST",
      "trigger": {"any": [{"path": "context.verify_live_required", "op": "eq", "value": true}]},
      "action": "Declare the property under test and match its relevant engine, version, configuration, permissions, data shape, concurrency, network, and failure behavior in an isolated environment.",
      "verifier": ["verify-live environment attestation"], "evidence": ["equivalence declaration", "provisioning identity", "live result and cleanup"],
      "blocking": true, "owner": "verification owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "SEC-001", "title": "Layered static and security analysis", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "intersects", "value": ["domain_code", "api_schema", "auth_security", "dependencies_tooling", "ai_model_behavior", "infrastructure"]}]},
      "action": "Run pinned compiler/type checks, native correctness analysis, deliberate non-overlapping linters, and semantic security analysis against the exact revision.",
      "verifier": ["verify static/security checks"], "evidence": ["tool identities", "results", "reviewed narrow suppressions"],
      "blocking": true, "owner": "security and component owners", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "SEC-002", "title": "Secret custody and exclusion", "strength": "MUST NOT",
      "trigger": {"all": [{"path": "context.active", "op": "eq", "value": true}]},
      "action": "Place no secret or credential value in prompts, chat, source, fixtures, generated artifacts, logs, telemetry, review records, or verification evidence.",
      "verifier": ["changed-content secret scan", "CI secret scan", "periodic history scan"], "evidence": ["scan results", "explicit reviewed false-positive rules", "rotation incident record for real findings"],
      "blocking": true, "owner": "security owner", "cadence": "continuous", "exception_eligible": false
    },
    {
      "id": "SEC-003", "title": "Dependency, license, and component assurance", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "dependencies_tooling"}, {"path": "work_item.change_classes", "op": "contains", "value": "release"}]},
      "action": "Inventory direct/transitive components, pin identities, scan vulnerabilities, review licenses/IP, verify provenance, and generate the profile-selected SBOM for release.",
      "verifier": ["dependency lock verifier", "vulnerability scan", "license policy", "SBOM validator"], "evidence": ["dependency diff", "scan/license results", "SBOM and provenance"],
      "blocking": true, "owner": "supply-chain owner", "cadence": "per_change", "exception_eligible": true
    },
    {
      "id": "SEC-004", "title": "Signed and provenanced supply chain", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.change_classes", "op": "contains", "value": "release"}, {"path": "work_item.material_change_triggers", "op": "contains", "value": "release_signing"}]},
      "action": "Verify source, tool, dependency, plugin, build, artifact, SBOM, provenance, and signature identities under approved custody and allowlists.",
      "verifier": ["signature verifier", "provenance policy verifier", "allowlist checker"], "evidence": ["verified signatures", "provenance", "allowlist decision"],
      "blocking": true, "owner": "release/security owner", "cadence": "per_release", "exception_eligible": false
    },
    {
      "id": "SEC-005", "title": "Enforced repository and release rules", "strength": "MUST",
      "trigger": {"all": [{"path": "context.shared_repository", "op": "eq", "value": true}]},
      "action": "Enforce required checks, reviews, conversation resolution, signing/provenance, protected refs, no force push, restricted bypass, and release-environment approvals on the hosting platform.",
      "verifier": ["hosting configuration export/test"], "evidence": ["ruleset/configuration identity", "enforcement test"],
      "blocking": true, "owner": "repository administrator", "cadence": "quarterly", "exception_eligible": true
    },
    {
      "id": "SEC-006", "title": "Adversarial testing and vulnerability response", "strength": "MUST",
      "trigger": {"any": [{"path": "work_item.risk_class", "op": "in", "value": ["high", "critical"]}, {"path": "work_item.change_classes", "op": "intersects", "value": ["auth_security", "ai_model_behavior"]}, {"path": "context.public_or_hostile_exposure", "op": "eq", "value": true}]},
      "action": "Run the profile-selected fuzzing, dynamic, penetration, red-team, fault-injection, or domain-abuse methods against declared scope and thresholds; operate a vulnerability intake/PSIRT process with severity-based remediation, disclosure, root-cause, and regression tracking.",
      "verifier": ["adversarial-test selector", "independence/scope check", "vulnerability SLA and regression tracker"], "evidence": ["method/scope/environment identity", "findings and exploit/failure evidence", "triage/remediation/disclosure decisions", "retest and regression results"],
      "blocking": true, "owner": "security/PSIRT owner", "cadence": "per_change", "exception_eligible": true,
      "references": ["https://learn.microsoft.com/en-us/compliance/assurance/assurance-microsoft-security-development-lifecycle", "https://csrc.nist.gov/pubs/sp/800/218/final"]
    },
    {
      "id": "SEC-007", "title": "Privileged access lifecycle", "strength": "MUST",
      "trigger": {"any": [{"path": "context.privileged_access", "op": "eq", "value": true}, {"path": "work_item.material_change_triggers", "op": "contains", "value": "privileged_access"}, {"path": "context.production_effects", "op": "eq", "value": true}]},
      "action": "Use separated environments and identities, least privilege, just-in-time time-bounded grants, approval, session audit, periodic recertification, revocation, and logged break-glass with immediate after-action review; prohibit shared or embedded credentials.",
      "verifier": ["entitlement policy and recertification check", "JIT grant/revocation test", "break-glass/session audit review"], "evidence": ["approved entitlement and expiry", "session/activity record", "revocation confirmation", "recertification or break-glass review"],
      "blocking": true, "owner": "identity/access owner", "cadence": "per_task", "exception_eligible": false,
      "references": ["https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"]
    },
    {
      "id": "DAT-001", "title": "Data classification and flow declaration", "strength": "MUST",
      "trigger": {"any": [{"path": "context.data_processed", "op": "eq", "value": true}]},
      "action": "Classify each input/output, map collection/use/storage/disclosure/egress, identify owner and subjects, and apply the profile default to unknown data.",
      "verifier": ["data-flow/profile review", "DLP policy check"], "evidence": ["data-flow inventory", "classification and owner decisions"],
      "blocking": true, "owner": "data/privacy owner", "cadence": "per_change", "exception_eligible": false
    },
    {
      "id": "DAT-002", "title": "Data minimization and privacy controls", "strength": "MUST",
      "trigger": {"any": [{"path": "context.personal_or_regulated_data", "op": "eq", "value": true}]},
      "action": "Minimize collected and disclosed fields, apply purpose limits and access controls, record legal/contractual authority, and test privacy-impact mitigations.",
      "verifier": ["privacy review", "field-level data-flow diff", "access/DLP tests"], "evidence": ["privacy decision", "minimization diff", "control tests"],
      "blocking": true, "owner": "privacy owner", "cadence": "per_change", "exception_eligible": false
    },
    {
